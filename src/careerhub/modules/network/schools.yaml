# A reviewed seed table of schools whose names are easy to confuse (CH-179, ADR 0046).
#
# It is NOT the full IPEDS list: the cloud sandbox cannot reach nces.ed.gov. Importing IPEDS into
# this same format is ticket CH-199. Names not in this table still use the word rules in schools.py.
#
# Each school:
#   name:      the official name
#   aliases:   other ways it is written (case, punctuation, "the", and hyphens do not matter)
#   branch_of: the university this is a branch campus of (a weaker tie to that university)
#   system:    a system of separate universities this belongs to (a weaker tie still)
# `systems` lists the system names themselves: a bare "University of California" matches no campus.
# `ambiguous` lists short names that mean several schools; they match nothing until the user picks
# one with a school alias in preferences.yaml.
systems:
  - University of California
  - California State University
  - State University of New York
  - University of Texas
  - University of Massachusetts
  - University of Illinois
  - University of Wisconsin
  - University of Minnesota
ambiguous:
  psu: [Pennsylvania State University, Portland State University, Plymouth State University]
  usc: [University of Southern California, University of South Carolina]
  uw: [University of Washington, University of Wisconsin-Madison]
  um: [University of Michigan, University of Minnesota, University of Maryland]
  wash u: [University of Washington, Washington University in St. Louis]
  msu: [Michigan State University, Montana State University, Mississippi State University]
  ut: [University of Texas at Austin, University of Tennessee]
schools:
  # Pennsylvania
  - name: Pennsylvania State University
    aliases: [Penn State, Penn State University, Pennsylvania State Univ, Penn State University Park]
  - name: Pennsylvania State University-Behrend
    aliases: [Penn State Behrend, Penn State Erie]
    branch_of: Pennsylvania State University
  - name: Pennsylvania State University-Altoona
    aliases: [Penn State Altoona]
    branch_of: Pennsylvania State University
  - name: Pennsylvania State University-Harrisburg
    aliases: [Penn State Harrisburg]
    branch_of: Pennsylvania State University
  - name: University of Pennsylvania
    aliases: [UPenn, U Penn, Penn, Penn University]
  - name: University of Pittsburgh
    aliases: [Pitt, Pitt Pittsburgh]
  - name: University of Pittsburgh-Johnstown
    aliases: [Pitt Johnstown, Pitt-Johnstown]
    branch_of: University of Pittsburgh
  - name: University of Pittsburgh-Bradford
    aliases: [Pitt Bradford]
    branch_of: University of Pittsburgh
  - name: Carnegie Mellon University
    aliases: [CMU, Carnegie Mellon]
  # New Jersey
