{% macro reactions(job_id, csrf, reasons) %}
{% if job_id is not none %}
<form method="post" action="/jobs/{{ job_id }}/react" class="reactions" hx-post="/jobs/{{ job_id }}/react" hx-target="closest article" hx-swap="outerHTML">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button type="submit" name="reaction" value="interested">Interested</button>
  <button type="submit" name="reaction" value="applied">Applied</button>
  <details class="why">
    <summary>Not interested</summary>
    <p class="muted">Pick the reason that fits best:</p>
    {% for key, label in reasons %}<button type="submit" name="reaction" value="not_interested" formaction="/jobs/{{ job_id }}/react?reason={{ key }}" hx-post="/jobs/{{ job_id }}/react?reason={{ key }}">{{ label }}</button>{% endfor %}
  </details>
</form>
{% endif %}
{% endmacro %}
