[project]
name = "careerhub"
version = "0.0.1"
description = "A local-first assistant that finds, ranks, and plans job applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "sqlcipher3-wheels>=0.5.7,<0.6",
    "keyring>=25,<26",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "icalendar>=6,<7",
    "recurring-ical-events>=3,<4",
    "pyobjc-framework-EventKit>=10; sys_platform == 'darwin'",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
hub = "careerhub.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-pyyaml>=6",
    "types-icalendar>=6",
    "httpx2>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerhub"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes. I: import order. B: likely bugs. UP: modern syntax. D: docstrings.
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"spikes/**" = ["D", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true

# recurring-ical-events ships no type information; it's used in one module (modules/plan/ics.py).
[[tool.mypy.overrides]]
module = ["recurring_ical_events", "EventKit", "Foundation"]
ignore_missing_imports = true

# pypdfium2 has no type stubs; it's used in one module (profile/documents.py).
[[tool.mypy.overrides]]
module = ["pypdfium2"]
ignore_missing_imports = true

# openpyxl has no type stubs here; it is used in one module (modules/network/layouts.py).
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
