[project]
name = "careerhub"
version = "0.0.1"
description = "A local-first assistant that finds, ranks, and plans job applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "sqlcipher3-wheels>=0.5.7,<0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerhub"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes. I: import order. B: likely bugs. UP: modern syntax. D: docstrings.
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"spikes/**" = ["D", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true
